name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create local.properties with Secrets
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "STREAM_API_KEY=${{ secrets.STREAM_API_KEY }}" >> local.properties
          echo "STREAM_API_SECRET=${{ secrets.STREAM_API_SECRET }}" >> local.properties
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> local.properties

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmeet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
